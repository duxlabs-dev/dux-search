dir: internal/mocks/{{.InterfaceDirRelative}}
structname: Mock{{.InterfaceName}}
pkgname: '{{.SrcPackageName}}'
filename: 'mock_{{.InterfaceName}}.go'
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/duxlabs-dev/dux-search/internal/api:
    config:
      dir: internal/mocks/api
      pkgname: mocks_api
    interfaces:
      IndexerInterface: {}
      WatcherInterface: {}
  github.com/duxlabs-dev/dux-search/internal/server:
    config:
      dir: internal/mocks/server
      pkgname: mocks_server
    interfaces:
      IndexerInterface: {}
      WatcherInterface: {}
  github.com/duxlabs-dev/dux-search/internal/watcher:
    config:
      dir: internal/mocks/watcher
      pkgname: mocks_watcher
    interfaces:
      Indexer: {}
  net:
    interfaces:
      Conn: {}
