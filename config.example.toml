# Dux Search Configuration File
# Default location: ~/.config/dsearch/config.toml
# Override with: dsearch -c /path/to/config.toml

# Index storage path (defaults to $XDG_CACHE_HOME/dsearch/index or ~/.cache/dsearch/index)
index_path = "~/.cache/dsearch/index"

# HTTP REST API, off by default. The unix socket in $XDG_RUNTIME_DIR is always
# served and is what the CLI uses. The HTTP API has no authentication, so any
# local account (or a web page you visit) can reach it once enabled.
http_enabled = false

# HTTP server listen address, used when http_enabled = true or `serve --http`
listen_addr = "127.0.0.1:43654"

# Maximum file size to index (in bytes)
max_file_bytes = 2097152  # 2MB

# Number of indexing workers (defaults to CPU count / 2)
worker_count = 4

# Index all file types (not just text files)
index_all_files = true

# File extensions to extract text content from
text_extensions = [
    ".txt", ".md", ".go", ".py", ".js", ".ts",
    ".jsx", ".tsx", ".json", ".yaml", ".yml",
    ".toml", ".html", ".css", ".rs", ".c",
    ".cpp", ".h", ".java", ".rb", ".php", ".sh",
]

# Multiple paths to index with individual configuration
[[index_paths]]
path = "/home/brandon"
max_depth = 6  # Default depth for home directory
exclude_hidden = true
extract_exif = true  # Extract EXIF metadata from images
exclude_dirs = [
    "node_modules", "bower_components", "__pycache__", "site-packages",
    "venv", ".venv", "target", "dist", "build", "vendor", ".cache"
]

[[index_paths]]
path = "/home/brandon/repos"
max_depth = 6  # Go deeper for repos directory
exclude_hidden = true
extract_exif = false  # Skip EXIF extraction for code repos
exclude_dirs = [
    "node_modules", "bower_components", "__pycache__", "site-packages",
    "venv", ".venv", "target", "dist", "build", "vendor", ".cache",
    ".git", ".idea", ".vscode"
]

[[index_paths]]
path = "/home/brandon/Documents"
max_depth = 0  # Unlimited depth for Documents
exclude_hidden = false  # Include hidden files in Documents
extract_exif = true  # Extract EXIF metadata from images
exclude_dirs = []

# Example: index a dotfiles repository.
# `merge_default_exclude_dirs = true` keeps the built-in noise list
# (node_modules, .cache, .venv, .git, ...) while letting you add extras
# without having to copy/paste the whole defaults array.
[[index_paths]]
path = "~/.dotfiles"
max_depth = 0
exclude_hidden = false  # Show sub-directories like .config inside the repo
extract_exif = false
merge_default_exclude_dirs = true
exclude_dirs = ["secrets"]

# Semantic search: find files, actions and settings by meaning, in any language
# (e.g. "tired eyes" finds Night Light). Off by default; with enabled = false dsearch
# behaves exactly as without it: no helper process, no vector database, no network.
#
# Needs the model (`dsearch model download`, about 300 MB for the text tower) and a
# system ONNX Runtime 1.22 or newer (libonnxruntime.so). Restart dsearch after
# changing this table.
[semantic]
enabled = false

# Where the model files live.
# Default: $XDG_DATA_HOME/dsearch/models/embeddinggemma-2
# model_dir = "~/.local/share/dsearch/models/embeddinggemma-2"

# Path of libonnxruntime.so; empty searches the standard library directories.
onnxruntime_lib = ""

# Inference threads; 0 = automatic (at most 4).
threads = 0

# The model is unloaded from memory after this many idle minutes and reloaded
# on the next search.
idle_unload_minutes = 10

# Which file kinds are embedded in the background (low priority, paused while
# you are active and, with pause_on_battery, while on battery power).
index_text = true
index_images = true
index_audio = true
max_chunks_per_file = 8
pause_on_battery = true
